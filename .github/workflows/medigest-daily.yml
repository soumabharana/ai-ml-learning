name: Medigest Daily

on:
  schedule:
    - cron: "0 21 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Kolkata
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: medigest/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r medigest/requirements.txt

      - name: Run research digest
        run: python medigest/med_digest.py
